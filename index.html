    <link rel="canonical" href="https://nexacalculator.netlify.app/" />

    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.png" />

    <meta name="theme-color" content="#080617" />

    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Web App Manifest (correct path for Vite public folder) -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Inline critical CSS for initial loading state (avoid FOUC) -->
    <style>
      /* Prevent FOUC while JS loads */
      html, body, #root {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background: #0f0c29;
        color: #f1f0ff;
        font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      /* Instant loading spinner before React mounts */
      #initial-loader {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background: linear-gradient(135deg, #0f0c29, #1a1035);
        flex-direction: column;
        gap: 20px;
      }

      #initial-loader .spinner {
        width: 48px;
        height: 48px;
        border: 4px solid rgba(124, 58, 237, 0.1);
        border-top-color: #7c3aed;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      #initial-loader .brand {
        font-family: 'Playfair Display', serif;
        font-size: 1.5rem;
        font-weight: 600;
        background: linear-gradient(135deg, #7c3aed, #f59e0b);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        letter-spacing: -0.02em;
      }
    </style>
  </head>
  <body>
    <!-- Initial loader removed after React mounts -->
    <div id="initial-loader">
      <div class="spinner" aria-hidden="true"></div>
      <div class="brand">Nexa Calculator</div>
    </div>

    <!-- React root -->
    <div id="root"></div>

    <script type="module" src="/src/main.jsx"></script>

    <!-- Structured data for SEO -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Nexa Calculator",
        "alternateName": "Nexa GPA & CGPA Calculator",
        "description": "Nexa Calculator is a free online academic tool offering GPA calculator, CGPA calculator, and scientific calculator for students worldwide.",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "All",
        "browserRequirements": "Requires JavaScript. Requires HTML5.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "creator": {
          "@type": "Person",
          "name": "Usman Murtaza"
        },
        "featureList": [
          "Semester GPA calculation",
          "Cumulative CGPA calculation",
          "Scientific calculator",
          "Grade tracking system",
          "Academic standing evaluation",
          "Real-time calculations"
        ],
        "url": "https://nexacalculator.netlify.app/",
        "keywords": "Nexa Calculator, GPA, CGPA, scientific calculator, academic tool"
      }
    </script>

    <!-- Hide the initial loader when React mounts -->
    <script>
      // Minimal script to hide the loader when the app renders
      // React will replace #root content; we also remove #initial-loader
      const observer = new MutationObserver(() => {
        const loader = document.getElementById('initial-loader');
        if (loader && document.getElementById('root').childElementCount > 0) {
          loader.style.opacity = '0';
          loader.style.transition = 'opacity 0.3s ease';
          setTimeout(() => {
            if (loader.parentNode) loader.parentNode.removeChild(loader);
          }, 300);
          observer.disconnect();
        }
      });
      observer.observe(document.getElementById('root'), { childList: true, subtree: true });
    </script>
  </body>
</html>
