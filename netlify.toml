[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  # Optional: enable npm caching for faster builds
  # NPM_FLAGS = "--prefer-offline"

# Single Page Application redirect – all routes to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Security headers (all routes) ──────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking
    X-Frame-Options = "DENY"
    # Cross‑site scripting filter
    X-XSS-Protection = "1; mode=block"
    # MIME‑type sniffing prevention
    X-Content-Type-Options = "nosniff"
    # Referrer policy
    Referrer-Policy = "strict-origin-when-cross-origin"
    # HTTP Strict Transport Security (HSTS) – 2 years
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
    # Permissions policy (disable microphone/camera unless used)
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Basic Content Security Policy (allow fonts from Google Fonts, scripts from self)
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com wss:; frame-src 'none'; object-src 'none'"

# ── Static assets (immutable cache) ────────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── HTML files (short cache, revalidation) ─────────────────────────
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# ── Manifest & robots (short cache) ───────────────────────────────
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Cache-Control = "public, max-age=86400"